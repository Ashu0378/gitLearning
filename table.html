    <h1>SPORTS PHYSICAL FORM</h1>
    <form action="">
        <fieldset>
            <legend>Athlete Information</legend>
                <ul>
                    <li>
                        <label for="fname">Name:</label>
                        <input type="text" id="fname" name="fname">
                    </li>
                    <li>
                        <label for="school">School/Team: </label>
                        <input type="text" id="school" name="school">
                    </li>
                    <li>
                        <label for="sport">Sport</label>
                        <input type="text">
                    </li>
                    <li>
                        <label for="parent">Parent/Guardian Name: </label>
                        <input type="text" id="parent" name="parent">
                    </li>
                    <li>
                        <label for="contact">Contact Number: </label>
                        <input type="number" id="contact" name="contact">
                    </li>
                </ul>
        </fieldset>
        <fieldset>
            <legend>Medical History for Athletes</legend>
            <ul>
                <li>
                    <label for="history">History of Concussions: </label>
                    <input type="checkbox" id="history" name="history">

                </li>
                <li>
                    <label for="surgery">Previous Surgeries: </label>
                    <input type="text" id="surgery" name="surgery">
                </li>
                <li>
                    <label for="fractures">Any Bone Fractures? </label>
                    <input type="text" id="fractures" name="fractures">
                </li>
                <li>
                    <label for="asthama">Asthama or Breathing Problems: </label>
                    <input type="text" id="asthama" name="asthama">
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>Fitness Assessment</legend>
            <table>
                
            </table>
        </fieldset>
    </form>
